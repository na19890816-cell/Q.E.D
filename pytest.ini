[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    numpy_accel: numpy 加速版の数値同等性・速度テスト (ADR-001)
    meta_validation: Phase 8 メタ検証レイヤーの整合性テスト (MetaValidator)
    dead_code: Phase 9 デッドコード整理の回帰テスト (statistics 完全除去 / 未使用引数削除)
    phase1_bridge: Phase 1 postgres_policy_bridge.py の DB レス単体テスト (psycopg3 MagicMock)
    phase2_portfolio_corr: Phase 2 (G2) 採用済みポートフォリオ相関ゲートの単体テスト (portfolio_correlation_gate.py)
    phase3_detect_kill: Phase 3 (G3) Detect→Kill ライフサイクル管理の単体テスト (frost_cusum.py / frost_lifecycle.py)
